<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PerpDEX 套利监控</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <h1>PerpDEX 套利监控</h1>
            <div class="status" id="status">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">连接中...</span>
            </div>
        </div>

        <!-- 价格表格 -->
        <div class="section">
            <h2>实时价格</h2>
            <table id="priceTable" class="data-table">
                <thead>
                    <tr>
                        <th>币种</th>
                        <th>01.xyz</th>
                        <th>nado</th>
                        <th>variational</th>
                    </tr>
                </thead>
                <tbody id="priceTableBody">
                    <tr>
                        <td colspan="4" class="loading">加载中...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- 价差表格 -->
        <div class="section">
            <h2>价差分析</h2>
            <table id="spreadTable" class="data-table">
                <thead>
                    <tr>
                        <th>交易对</th>
                        <th>币种</th>
                        <th>价差</th>
                        <th>价差%</th>
                        <th>状态</th>
                    </tr>
                </thead>
                <tbody id="spreadTableBody">
                    <tr>
                        <td colspan="5" class="loading">加载中...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- 交易信号 -->
        <div class="section">
            <h2>交易信号</h2>
            <table id="signalTable" class="data-table">
                <thead>
                    <tr>
                        <th>交易对</th>
                        <th>币种</th>
                        <th>信号</th>
                        <th>操作</th>
                        <th>预期利润</th>
                    </tr>
                </thead>
                <tbody id="signalTableBody">
                    <tr>
                        <td colspan="5" class="loading">加载中...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- 底部操作 -->
        <div class="footer">
            <button id="refreshBtn" class="btn btn-primary">刷新</button>
            <button id="optionsBtn" class="btn btn-secondary">设置</button>
            <div class="last-update" id="lastUpdate">最后更新: --</div>
        </div>
    </div>

    <script src="lib/config.js"></script>
    <script src="lib/data-collector.js"></script>
    <script src="lib/spread-analyzer.js"></script>
    <script src="popup.js"></script>
</body>
</html>
