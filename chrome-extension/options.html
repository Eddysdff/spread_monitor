<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PerpDEX 套利监控 - 设置</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background: #1e1e1e;
            color: #e0e0e0;
        }
        h1 {
            color: #4fc3f7;
        }
        .section {
            margin: 20px 0;
            padding: 20px;
            background: #252525;
            border-radius: 8px;
        }
        label {
            display: block;
            margin: 10px 0 5px;
        }
        input {
            width: 100%;
            padding: 8px;
            background: #333;
            border: 1px solid #555;
            border-radius: 4px;
            color: #e0e0e0;
        }
        button {
            padding: 10px 20px;
            background: #4fc3f7;
            color: #1e1e1e;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
        }
        button:hover {
            background: #29b6f6;
        }
    </style>
</head>
<body>
    <h1>PerpDEX 套利监控 - 设置</h1>
    
    <div class="section">
        <h2>更新频率</h2>
        <label>
            更新间隔（秒）:
            <input type="number" id="updateInterval" value="1" min="1" max="60">
        </label>
    </div>
    
    <div class="section">
        <h2>价差阈值</h2>
        <label>
            最小价差阈值 (%):
            <input type="number" id="minSpreadThreshold" value="0.05" step="0.01" min="0">
        </label>
        <label>
            最大价差阈值 (%):
            <input type="number" id="maxSpreadThreshold" value="1.0" step="0.1" min="0">
        </label>
    </div>
    
    <button id="saveBtn">保存设置</button>
    
    <script src="options.js"></script>
</body>
</html>
